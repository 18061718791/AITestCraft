<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的待办统计测试</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1890ff;
            border-bottom: 2px solid #1890ff;
            padding-bottom: 10px;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            border-radius: 6px;
        }
        .section h3 {
            margin-top: 0;
            color: #52c41a;
        }
        .error {
            background: #fff1f0;
            border-color: #ffa39e;
        }
        .error h3 {
            color: #f5222d;
        }
        .warning {
            background: #fffbe6;
            border-color: #ffe58f;
        }
        .warning h3 {
            color: #faad14;
        }
        pre {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        .btn {
            background: #1890ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover {
            background: #40a9ff;
        }
        .result {
            margin-top: 20px;
        }
        .project-card {
            background: white;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            padding: 15px;
            margin: 10px 0;
        }
        .project-title {
            font-weight: bold;
            font-size: 16px;
            color: #262626;
            margin-bottom: 10px;
        }
        .system-list {
            margin-left: 20px;
        }
        .system-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px dashed #e8e8e8;
        }
        .badge {
            background: #ff4d4f;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }
        .badge-success {
            background: #52c41a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 我的待办统计测试工具</h1>
        
        <div class="section">
            <h3>📋 测试说明</h3>
            <p>此工具用于验证"我的待办"数据统计是否正确。</p>
            <p>期望数据：</p>
            <ul>
                <li>智能物联项目 (ID: 2980): <strong>17条</strong> 待办</li>
                <li>测试项目 (ID: 2981): <strong>2条</strong> 待办</li>
            </ul>
        </div>

        <button class="btn" onclick="runTest()">🚀 开始测试</button>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3001/api';
        
        const TEST_PROJECTS = [
            { id: 2980, name: '智能物联项目', expectedCount: 17 },
            { id: 2981, name: '测试项目', expectedCount: 2 }
        ];

        async function fetchAPI(url, params = {}) {
            const queryString = new URLSearchParams(params).toString();
            const fullUrl = `${API_BASE_URL}${url}${queryString ? '?' + queryString : ''}`;
            
            try {
                const response = await fetch(fullUrl);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return await response.json();
            } catch (error) {
                throw error;
            }
        }

        async function getProjects() {
            try {
                const data = await fetchAPI('/projects');
                return data.data || [];
            } catch (error) {
                console.error('获取项目列表失败:', error);
                return [];
            }
        }

        async function getProjectTodos(projectId) {
            try {
                const data = await fetchAPI('/defects/my-todo', {
                    project_id: projectId,
                    page: 1,
                    pageSize: 1000
                });
                return data.data?.list || [];
            } catch (error) {
                console.error(`获取项目 ${projectId} 待办失败:`, error);
                return [];
            }
        }

        function groupBySystem(todos) {
            const systemMap = new Map();
            
            todos.forEach(todo => {
                const systemModule = todo.system_module_name || '未分类';
                // 提取系统名称（从 "系统名称 - 模块名称" 中提取）
                const systemName = systemModule.split(' - ')[0] || '未分类';
                
                systemMap.set(systemName, (systemMap.get(systemName) || 0) + 1);
            });
            
            return Array.from(systemMap.entries())
                .map(([name, count]) => ({ name, count }))
                .sort((a, b) => b.count - a.count);
        }

        async function runTest() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="section"><h3>⏳ 测试中...</h3></div>';

            let html = '';
            let totalCount = 0;

            // 1. 获取项目列表
            html += '<div class="section"><h3>📁 项目列表</h3>';
            try {
                const projects = await getProjects();
                html += `<p>获取到 <strong>${projects.length}</strong> 个项目</p>`;
                html += '<ul>';
                projects.forEach(p => {
                    html += `<li>ID: ${p.id} - ${p.name}</li>`;
                });
                html += '</ul>';
            } catch (error) {
                html += `<p class="error">❌ 获取项目列表失败: ${error.message}</p>`;
            }
            html += '</div>';

            // 2. 测试每个项目
            for (const project of TEST_PROJECTS) {
                html += `<div class="project-card">`;
                html += `<div class="project-title">🗂️ ${project.name} (ID: ${project.id})</div>`;
                
                try {
                    const todos = await getProjectTodos(project.id);
                    totalCount += todos.length;
                    
                    html += `<p>返回待办数量: <span class="badge ${todos.length === project.expectedCount ? 'badge-success' : ''}">${todos.length}</span> / 期望: ${project.expectedCount}</p>`;
                    
                    if (todos.length > 0) {
                        // 显示前3条
                        html += '<p><strong>前3条待办:</strong></p>';
                        html += '<ul>';
                        todos.slice(0, 3).forEach((todo, index) => {
                            html += `<li>ID:${todo.id} ${todo.subject}<br>`;
                            html += `<small>系统/模块: ${todo.system_module_name || '未分类'} | 分配给: ${todo.assigned_to_name} (ID:${todo.assigned_to_id}) | 状态: ${todo.status_name}</small></li>`;
                        });
                        html += '</ul>';
                        
                        // 按系统分组
                        const systems = groupBySystem(todos);
                        html += '<p><strong>按系统分组:</strong></p>';
                        html += '<div class="system-list">';
                        systems.forEach(sys => {
                            html += `<div class="system-item"><span>${sys.name}</span><span class="badge">${sys.count} 条</span></div>`;
                        });
                        html += '</div>';
                    } else {
                        html += '<p class="warning">⚠️ 没有返回待办数据！</p>';
                    }
                } catch (error) {
                    html += `<p class="error">❌ 查询失败: ${error.message}</p>`;
                }
                
                html += '</div>';
            }

            // 3. 汇总
            html += '<div class="section"><h3>📊 测试结果汇总</h3>';
            const expectedTotal = TEST_PROJECTS.reduce((sum, p) => sum + p.expectedCount, 0);
            html += `<p>实际总数: <strong>${totalCount}</strong></p>`;
            html += `<p>期望总数: <strong>${expectedTotal}</strong></p>`;
            
            if (totalCount === 0) {
                html += '<div class="section error">';
                html += '<h3>⚠️ 警告: 没有获取到任何待办数据！</h3>';
                html += '<p>可能原因:</p>';
                html += '<ol>';
                html += '<li>后端API固定 assigned_to_id = 130，当前用户可能不是130</li>';
                html += '<li>状态筛选条件导致数据被过滤（status_id != 5 OR status_id = 3）</li>';
                html += '<li>项目ID或目录关联有问题</li>';
                html += '<li>后端服务未启动或API路径错误</li>';
                html += '</ol>';
                html += '</div>';
            } else if (totalCount !== expectedTotal) {
                html += '<div class="section warning">';
                html += '<h3>⚠️ 数据不匹配</h3>';
                html += '<p>实际返回的待办数量与期望不符，可能原因:</p>';
                html += '<ol>';
                html += '<li>后端筛选条件与前端显示不一致</li>';
                html += '<li>某些待办的状态已变更</li>';
                html += '<li>项目ID对应关系有误</li>';
                html += '</ol>';
                html += '</div>';
            } else {
                html += '<div class="section" style="background: #f6ffed; border-color: #52c41a;">';
                html += '<h3 style="color: #52c41a;">✅ 数据验证通过！</h3>';
                html += '<p>我的待办统计数据正确。</p>';
                html += '</div>';
            }
            html += '</div>';

            resultDiv.innerHTML = html;
        }
    </script>
</body>
</html>
